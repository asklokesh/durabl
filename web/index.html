<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>durabl — replay &amp; time-travel</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236366f1'/%3E%3Cpath d='M9 16h14M16 9v14' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <div>
            <div class="brand-name">durabl</div>
            <div class="brand-sub">replay &amp; time-travel</div>
          </div>
        </div>
        <div class="source-pill" id="sourcePill" title="where this journal is reconstructed from">
          <span class="dot"></span><span id="sourceLabel">loading…</span>
        </div>
      </header>

      <div class="layout">
        <!-- Left: runs + fork tree -->
        <aside class="sidebar">
          <div class="panel hitl-panel" id="hitlPanel" hidden>
            <div class="panel-title">Awaiting human input</div>
            <div id="hitlPausedList" class="hitl-paused-list"></div>
          </div>
          <div class="panel">
            <div class="panel-title">Runs &amp; fork tree</div>
            <div id="tree" class="tree"></div>
          </div>
        </aside>

        <!-- Center: timeline + time-travel -->
        <main class="main">
          <div class="run-header" id="runHeader"></div>

          <div class="hitl-banner" id="hitlBanner" hidden>
            <div class="hitl-banner-head">
              <span class="hitl-pill">Awaiting human input</span>
              <span class="hitl-banner-sub" id="hitlBannerSub"></span>
            </div>
            <form id="hitlForm" class="hitl-form">
              <label class="hitl-label" for="hitlDecision">Decision</label>
              <textarea id="hitlDecision" name="decision" rows="2" placeholder="e.g. APPROVED — same as durabl hitl-input" required></textarea>
              <div class="hitl-form-actions">
                <button type="submit" class="btn-primary" id="hitlSubmitBtn">Submit &amp; resume</button>
                <span class="hitl-form-msg" id="hitlFormMsg" hidden></span>
              </div>
            </form>
            <p class="hitl-offline-note" id="hitlOfflineNote" hidden>
              Offline export: paused runs are visible for replay only. Resume requires live mode with Restate ingress.
            </p>
          </div>

          <div class="tt-bar" id="ttBar" hidden>
            <div class="tt-label">Time-travel</div>
            <input id="ttRange" type="range" min="1" max="1" value="1" />
            <div class="tt-readout"><span id="ttNow">1</span> / <span id="ttMax">1</span></div>
            <button id="ttLive" class="btn-ghost">↺ full run</button>
          </div>

          <div class="timeline" id="timeline"></div>
        </main>

        <!-- Right: step detail / diff -->
        <section class="detail">
          <div class="detail-tabs">
            <button class="tab active" data-tab="step">Step detail</button>
            <button class="tab" data-tab="diff">Trajectory diff</button>
          </div>
          <div id="tab-step" class="tab-panel active"></div>
          <div id="tab-diff" class="tab-panel"></div>
        </section>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
