<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>durabl — replay &amp; time-travel</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236366f1'/%3E%3Cpath d='M9 16h14M16 9v14' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="app">
      <header class="topbar" role="banner">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <div>
            <div class="brand-name">durabl</div>
            <div class="brand-sub">replay &amp; time-travel</div>
          </div>
        </div>
        <div class="source-pill" id="sourcePill" aria-label="Journal source" title="where this journal is reconstructed from">
          <span class="dot" aria-hidden="true"></span><span id="sourceLabel">loading…</span>
        </div>
      </header>

      <div class="layout">
        <aside class="sidebar" aria-label="Runs and human-in-the-loop queue">
          <div class="panel hitl-panel" id="hitlPanel" hidden>
            <div class="panel-title" id="hitlPanelTitle">Awaiting human input</div>
            <div id="hitlPausedList" class="hitl-paused-list" role="list" aria-labelledby="hitlPanelTitle"></div>
          </div>
          <div class="panel">
            <div class="panel-title" id="treePanelTitle">Runs &amp; fork tree</div>
            <div id="tree" class="tree" role="tree" aria-labelledby="treePanelTitle"></div>
          </div>
        </aside>

        <main class="main" id="main-content">
          <div class="run-header" id="runHeader" aria-live="polite"></div>

          <div class="hitl-banner" id="hitlBanner" hidden role="region" aria-labelledby="hitlBannerTitle">
            <div class="hitl-banner-head">
              <span class="hitl-pill" id="hitlBannerTitle">Awaiting human input</span>
              <span class="hitl-banner-sub" id="hitlBannerSub"></span>
            </div>
            <form id="hitlForm" class="hitl-form" aria-describedby="hitlOfflineNote hitlFormMsg">
              <label class="hitl-label" for="hitlDecision">Decision</label>
              <textarea id="hitlDecision" name="decision" rows="2" placeholder="e.g. APPROVED — same as durabl hitl-input" required aria-required="true"></textarea>
              <div class="hitl-form-actions">
                <button type="submit" class="btn-primary" id="hitlSubmitBtn">Submit &amp; resume</button>
                <span class="hitl-form-msg" id="hitlFormMsg" role="status" aria-live="polite" hidden></span>
              </div>
            </form>
            <p class="hitl-offline-note" id="hitlOfflineNote" hidden>
              Offline export: paused runs are visible for replay only. Resume requires live mode with Restate ingress.
            </p>
          </div>

          <div class="tt-bar" id="ttBar" hidden role="group" aria-labelledby="ttLabel">
            <div class="tt-label" id="ttLabel">Time-travel</div>
            <input id="ttRange" type="range" min="1" max="1" value="1" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1" aria-valuetext="Step 1 of 1" />
            <div class="tt-readout" id="ttReadout" aria-live="polite"><span id="ttNow">1</span> / <span id="ttMax">1</span></div>
            <button type="button" id="ttLive" class="btn-ghost">↺ full run</button>
          </div>

          <div class="timeline" id="timeline" role="list" aria-label="Run timeline"></div>
        </main>

        <section class="detail" aria-label="Step detail and trajectory diff">
          <div class="detail-tabs" role="tablist" aria-label="Detail views">
            <button type="button" class="tab active" role="tab" id="tab-btn-step" data-tab="step" aria-selected="true" aria-controls="tab-step" tabindex="0">Step detail</button>
            <button type="button" class="tab" role="tab" id="tab-btn-diff" data-tab="diff" aria-selected="false" aria-controls="tab-diff" tabindex="-1">Trajectory diff</button>
          </div>
          <div id="tab-step" class="tab-panel active" role="tabpanel" aria-labelledby="tab-btn-step"></div>
          <div id="tab-diff" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-diff" hidden></div>
        </section>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
