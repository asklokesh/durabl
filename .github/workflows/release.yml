name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pack:
    name: npm pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pack tarball
        run: npm pack

      - name: Upload npm pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack-${{ github.ref_name }}
          path: durabl-*.tgz
          if-no-files-found: error
          retention-days: 90
