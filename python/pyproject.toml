[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "durabl"
version = "0.1.0"
description = "Python client for durabl — offline JSONL journal replay and replay UI HTTP API"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
]
keywords = ["durabl", "replay", "journal", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/asklokesh/durabl"
Documentation = "https://github.com/asklokesh/durabl/blob/main/docs/PYTHON-SDK.md"

[tool.hatch.build.targets.wheel]
packages = ["durabl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
