# durabl — local self-host stack (Restate + durabl SDK service).
# No secrets in this file; set API keys in your shell or a local .env (gitignored).
#
#   docker compose --profile docker-demo up --build
#   npm run compose:up
#
# Then register the deployment (one-time per stack start):
#   docker compose --profile docker-demo exec restate restate deployments register http://durabl:9080
#
# Gates and CLI still use the npm harness on the host by default; this compose
# file is for operators who want a reproducible two-container demo environment.

services:
  restate:
    profiles: ["docker-demo"]
    image: docker.restate.dev/restatedev/restate:1.6.2
    ports:
      - "8080:8080"   # ingress
      - "9070:9070"   # admin
    volumes:
      - restate-data:/restate-data
    command: ["--node-name", "durabl-local"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9070/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  durabl:
    profiles: ["docker-demo"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DURABL_DATA_DIR: /data
      DURABL_SERVICE_PORT: "9080"
      DURABL_RESTATE_INGRESS: http://restate:8080
      DURABL_RESTATE_ADMIN: http://restate:9070
    volumes:
      - durabl-data:/data
    ports:
      - "9080:9080"
    depends_on:
      restate:
        condition: service_healthy

volumes:
  restate-data:
  durabl-data:
